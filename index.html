<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🐟 番茄</title>
<style>
  :root {
    --pink-50: #FFF7FA;
    --pink-100: #FFEEF4;
    --pink-200: #FFD6E4;
    --pink-300: #FFB3D1;
    --pink-400: #FF8FBA;
    --pink-500: #F56AA1;
    --rose-500: #E5547D;
    --blue-gray: #7A8FB5;
    --text-main: #5A4A54;
    --text-sub: #8A7886;
    --white: #FFFFFF;
    --shadow: 0 6px 18px rgba(245, 106, 161, 0.12);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  body {
    background: var(--pink-50);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 24px;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 18px 16px 24px;
  }

  /* Header */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--rose-500);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .logo-fish {
    font-size: 24px;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--white);
    color: var(--pink-500);
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--white);
    border-radius: 999px;
    padding: 4px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tab.active {
    background: linear-gradient(135deg, var(--pink-300), var(--pink-400));
    color: white;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(245, 106, 161, 0.28);
  }

  /* Panels */
  .panel {
    display: none;
  }

  .panel.active {
    display: block;
  }

  /* Card */
  .card {
    background: var(--white);
    border-radius: 24px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--rose-500);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Timer */
  .timer-card {
    text-align: center;
    padding: 24px 18px;
  }

  .timer-display {
    font-size: 56px;
    font-weight: 800;
    color: var(--rose-500);
    letter-spacing: 2px;
    margin: 10px 0 18px;
    font-variant-numeric: tabular-nums;
  }

  .timer-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  .btn:active {
    transform: scale(0.96);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--pink-400), var(--rose-500));
    color: white;
    box-shadow: 0 8px 20px rgba(245, 106, 161, 0.35);
  }

  .btn-secondary {
    background: var(--pink-100);
    color: var(--rose-500);
  }

  .btn-ghost {
    background: var(--white);
    color: var(--pink-500);
    border: 1px solid var(--pink-200);
  }

  .btn-small {
    padding: 8px 14px;
    font-size: 13px;
  }

  /* Inputs */
  .input,
  .textarea {
    width: 100%;
    border: 1px solid var(--pink-200);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 15px;
    background: var(--pink-50);
    color: var(--text-main);
    outline: none;
  }

  .input:focus,
  .textarea:focus {
    border-color: var(--pink-400);
    background: white;
  }

  .textarea {
    resize: none;
    min-height: 70px;
  }

  .row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  /* Tasks */
  .task-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .task-input-row .input {
    flex: 1;
  }

  .task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .task-card {
    background: var(--pink-50);
    border: 1px solid var(--pink-200);
    border-radius: 18px;
    padding: 14px;
    transition: all 0.2s ease;
  }

  .task-card.active {
    background: linear-gradient(135deg, #FFF0F7, #FFE1F0);
    border-color: var(--pink-300);
  }

  .task-card.done .task-name {
    text-decoration: line-through;
    color: var(--text-sub);
  }

  .task-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-circle {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--pink-400);
    background: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .status-circle.done {
    background: var(--pink-400);
  }

  .status-circle.done::after {
    content: "✔";
    color: white;
    font-size: 13px;
    font-weight: 700;
  }

  .task-name {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
  }

  .task-minutes {
    font-size: 13px;
    color: var(--rose-500);
    background: white;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .task-delete {
    background: transparent;
    border: none;
    color: var(--text-sub);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
  }

  .review-text {
    margin-top: 10px;
    font-size: 13px;
    color: var(--blue-gray);
    line-height: 1.6;
    background: white;
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px dashed var(--pink-200);
    min-height: 20px;
    outline: none;
  }

  .review-text:empty::before {
    content: "写一点复盘吧～";
    color: #AAB7D1;
  }

  /* Sub-task & Done */
  .subtask-input {
    margin-top: 4px;
  }

  .done-item {
    background: var(--pink-50);
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--text-sub);
    text-decoration: line-through;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .done-min {
    color: var(--rose-500);
    font-weight: 700;
    text-decoration: none;
  }

  .done-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .done-del {
    background: none;
    border: none;
    color: #E5547D;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 8px;
    opacity: 0.75;
  }
  .done-del:hover {
    opacity: 1;
    background: var(--pink-100);
  }

  /* Calendar */
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .cal-month {
    font-size: 18px;
    font-weight: 700;
    color: var(--rose-500);
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }

  .cal-weekday {
    text-align: center;
    font-size: 12px;
    color: var(--text-sub);
    padding: 6px 0;
  }

  .cal-day {
    aspect-ratio: 1;
    border-radius: 14px;
    background: var(--pink-50);
    border: 1px solid var(--pink-100);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--text-main);
    cursor: pointer;
    padding: 4px;
    text-align: center;
  }

  .cal-day.has-record {
    background: linear-gradient(135deg, #FFE1F0, #FFC7E1);
    border-color: var(--pink-300);
  }

  .cal-day.today {
    border: 2px solid var(--rose-500);
  }

  .cal-day-num {
    font-weight: 700;
    font-size: 14px;
  }

  .cal-day-min {
    font-size: 11px;
    color: var(--rose-500);
    margin-top: 2px;
  }

  .empty-tip {
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    padding: 30px 0;
  }

  /* Modal */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(90, 74, 84, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }

  .modal-mask.show {
    display: flex;
  }

  .modal {
    background: white;
    border-radius: 24px;
    padding: 20px;
    width: 100%;
    max-width: 360px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 40px rgba(245, 106, 161, 0.25);
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--rose-500);
    margin-bottom: 12px;
  }

  .day-task-item {
    background: var(--pink-50);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .day-task-name {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .day-task-review {
    font-size: 13px;
    color: var(--blue-gray);
    line-height: 1.6;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  /* Export */
  .export-area {
    background: var(--pink-50);
    border-radius: 14px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.7;
    white-space: normal;
    color: var(--text-main);
    max-height: 300px;
    overflow-y: auto;
  }

  /* 导出与打印共用的粉色汇总样式 */
  .p-page {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #5A4A54;
    padding: 8px;
  }
  .p-title {
    font-size: 24px;
    font-weight: 800;
    color: #E5547D;
    margin-bottom: 4px;
  }
  .p-sub {
    font-size: 12px;
    color: #8A7886;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid #FFD6E4;
  }
  .p-day {
    margin-bottom: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #FFF7FA;
    border: 1px solid #FFE3EE;
  }
  .p-day-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }
  .p-day-num {
    font-size: 16px;
    font-weight: 700;
    color: #E5547D;
  }
  .p-day-week {
    font-size: 11px;
    color: #F56AA1;
  }
  .p-day-total {
    margin-left: auto;
    font-size: 12px;
    font-weight: 600;
    color: #7A8FB5;
  }
  .p-task {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    padding: 3px 0;
  }
  .p-status {
    display: inline-block;
    width: 16px;
    font-weight: 700;
    font-size: 13px;
  }
  .p-status-done { color: #2FBF71; }
  .p-status-doing { color: #F0A500; }
  .p-status-none { color: #C4B8C0; }
  .p-name {
    font-size: 14px;
    font-weight: 600;
    color: #5A4A54;
  }
  .p-min {
    font-size: 12px;
    font-weight: 600;
    color: #F56AA1;
    margin-left: 8px;
  }
  .p-review {
    width: 100%;
    font-size: 11px;
    font-weight: 400;
    font-style: italic;
    color: #8A7886;
    margin-top: 2px;
    padding-left: 16px;
  }
  .p-legend {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dashed #FFD6E4;
    font-size: 11px;
    color: #8A7886;
    display: flex;
    gap: 16px;
  }
  .p-empty {
    font-size: 14px;
    color: #8A7886;
    padding: 20px 0;
    text-align: center;
  }

  /* 任务类型 & 搁置 & 时间段 */
  .type-pick { display: flex; gap: 6px; }
  .type-pick-btn { flex: 1; border: 1px solid var(--pink-200); background: var(--pink-50); color: var(--text-sub); border-radius: 10px; padding: 6px 0; font-size: 13px; cursor: pointer; }
  .type-pick-btn.active { background: var(--pink-300); color: #fff; border-color: var(--pink-300); font-weight: 700; }
  .type-tag { display: inline-block; font-size: 10px; font-weight: 700; background: #FFD6E4; color: #E5547D; border-radius: 6px; padding: 1px 5px; margin-right: 6px; vertical-align: middle; }
  .type-tag.small { background: #F3E7EE; color: #B79AA8; }
  .task-name.small { font-weight: 400; color: #B79AA8; }
  .done-name { font-size: 14px; }
  .done-name.small { font-weight: 400; color: #B79AA8; }
  .done-name:not(.small) { font-weight: 700; color: var(--rose-500); }
  .rec-range { font-size: 11px; color: var(--blue-gray); font-weight: 400; }
  .p-type-tag { font-size: 10px; font-weight: 700; background: #FFD6E4; color: #E5547D; border-radius: 6px; padding: 1px 5px; margin-right: 6px; }
  .p-type-tag-small { background: #F3E7EE; color: #B79AA8; }
  .p-task-big .p-name { font-weight: 800; color: #D6456F; }
  .p-task-small .p-name { font-weight: 400; color: #A78FA0; }
  .shelved-item { background: var(--pink-50); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
  .shelved-main { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .shelved-name { font-weight: 700; color: var(--rose-500); }
  .shelved-name.small { font-weight: 400; color: #B79AA8; }
  .shelved-sub { color: var(--text-sub); font-size: 12px; }
  .shelved-meta { font-size: 12px; color: var(--blue-gray); margin-top: 4px; }
  .shelved-actions { display: flex; gap: 8px; margin-top: 6px; }

  /* Print */
  #printContainer { display: none; }

  @media print {
    body { background: #fff !important; padding: 0 !important; }
    #app { display: none !important; }
    #dayModal { display: none !important; }
    #exportArea { display: none !important; }
    #printContainer {
      display: block !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }

  /* Fish decorations */
  .fish-deco {
    position: fixed;
    font-size: 28px;
    opacity: 0.35;
    pointer-events: none;
  }

  .fish-1 { top: 12%; right: 6%; transform: rotate(-20deg); }
  .fish-2 { bottom: 8%; left: 4%; transform: rotate(30deg); }

  @media (max-width: 360px) {
    .timer-display { font-size: 48px; }
    .btn { padding: 10px 14px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="fish-deco fish-1">🐟</div>
<div class="fish-deco fish-2">🍅</div>

<div class="app">
  <header class="app-header">
    <div class="logo">
      <span class="logo-fish">🐟</span>
      <span>番茄</span>
    </div>
    <button class="icon-btn" id="toastBtn" title="鱼鱼提醒">🐟</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="focus">🐟 专注</button>
    <button class="tab" data-tab="record">📝 记录</button>
    <button class="tab" data-tab="calendar">📅 月历</button>
  </div>

  <!-- Focus Panel -->
  <section class="panel active" id="panel-focus">
    <div class="card timer-card">
      <div style="font-size:13px;color:var(--text-sub);">本轮专注</div>
      <div class="timer-display" id="timeText">25:00</div>

      <div style="display:flex;justify-content:center;gap:8px;align-items:center;margin-bottom:14px;">
        <label style="font-size:13px;color:var(--text-sub);">时长</label>
        <input type="number" id="timeInput" value="25" min="1"
          style="width:60px;padding:6px 8px;border-radius:10px;border:1px solid var(--pink-200);background:var(--pink-50);text-align:center;" />
        <span style="font-size:13px;color:var(--text-sub);">分钟</span>
      </div>

      <div class="timer-controls">
        <button class="btn btn-primary" id="start">开始</button>
        <button class="btn btn-secondary" id="pause">暂停</button>
        <button class="btn btn-ghost" id="add20">+20</button>
        <button class="btn btn-ghost" id="reset">重置</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🎯 当前大任务</div>
      <div id="activeTaskBox">
        <div style="font-size:13px;color:var(--text-sub);text-align:center;padding:10px 0;">
          请先在下方选择一个大任务
        </div>
      </div>

      <div style="margin-top:14px;">
        <textarea class="textarea subtask-input" id="subTaskInput" placeholder="本轮做了什么？"></textarea>
        <div class="row">
          <button class="btn btn-primary" id="addSubDone" style="flex:1;">提前完成本轮</button>
          <button class="btn btn-secondary" id="shelveBtn">⏸ 搁置</button>
        </div>
      </div>
    </div>

    <div class="card" id="shelveCard" style="display:none;">
      <div class="card-title">⏸ 待继续任务</div>
      <div id="shelvedList"></div>
    </div>

    <div class="card">
      <div class="card-title">📝 大任务列表</div>
      <div class="type-pick" style="margin-bottom:8px;">
        <button class="type-pick-btn active" data-tp="big">🟥 大任务</button>
        <button class="type-pick-btn" data-tp="small">🔹 小任务</button>
      </div>
      <div class="task-input-row">
        <input class="input" id="todoInput" placeholder="添加任务" />
        <button class="btn btn-secondary btn-small" id="addTodoBtn">添加</button>
      </div>
      <div class="task-list" id="todoList"></div>
    </div>
  </section>

  <!-- Record Panel -->
  <section class="panel" id="panel-record">
    <div class="card">
      <div class="card-title">✅ 已完成</div>
      <div id="doneList"></div>
    </div>

    <div class="card">
      <div class="card-title">💡 临时备忘</div>
      <textarea class="textarea" id="noteBox" placeholder="别的想法先写在这里"></textarea>
    </div>
  </section>

  <!-- Calendar Panel -->
  <section class="panel" id="panel-calendar">
    <div class="card">
      <div class="cal-header">
        <button class="btn btn-ghost btn-small" id="prevMonth">‹</button>
        <div class="cal-month" id="calMonth"></div>
        <button class="btn btn-ghost btn-small" id="nextMonth">›</button>
      </div>

      <div class="cal-grid">
        <div class="cal-weekday">日</div>
        <div class="cal-weekday">一</div>
        <div class="cal-weekday">二</div>
        <div class="cal-weekday">三</div>
        <div class="cal-weekday">四</div>
        <div class="cal-weekday">五</div>
        <div class="cal-weekday">六</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>

      <div style="margin-top:14px;">
        <button class="btn btn-primary btn-small" id="exportBtn">导出当月汇总</button>
        <button class="btn btn-secondary btn-small" id="printBtn" style="margin-left:8px;">🖨 打印汇总</button>
      </div>

      <div class="export-area" id="exportArea" style="display:none;"></div>
    </div>
  </section>
</div>

<!-- Print-only monthly summary -->
<div id="printContainer"></div>

<!-- Day Detail Modal -->
<div class="modal-mask" id="dayModal">
  <div class="modal">
    <div class="modal-title" id="dayModalTitle"></div>
    <div id="dayModalContent"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary btn-small" id="closeModal" style="flex:1;">关闭</button>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "fish_tomato_data_v1";

  const defaultData = {
    todos: [],
    done: [],
    notes: "",
    activeTodoIndex: null,
    timer: {
      totalSeconds: 25 * 60,
      baseSeconds: 25 * 60,
      addedSeconds: 0,
      running: false,
      endAt: null,
      elapsedSec: 0,
      sessionStartAt: null,
      sessionStartClock: null
    },
    shelved: []
  };

  let data = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(defaultData));
      const parsed = JSON.parse(raw);
      return Object.assign(JSON.parse(JSON.stringify(defaultData)), parsed, {
        timer: Object.assign({}, defaultData.timer, parsed.timer || {}),
        shelved: Array.isArray(parsed.shelved) ? parsed.shelved : []
      });
    } catch (e) {
      return JSON.parse(JSON.stringify(defaultData));
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  // Tab switching
  const tabs = document.querySelectorAll(".tab");
  const panels = document.querySelectorAll(".panel");
  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      panels.forEach(p => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
    });
  });

  // Timer
  const timeText = document.getElementById("timeText");
  const timeInput = document.getElementById("timeInput");
  const startBtn = document.getElementById("start");
  const pauseBtn = document.getElementById("pause");
  const addBtn = document.getElementById("add20");
  const resetBtn = document.getElementById("reset");
  let timerId = null;

  function updateDisplay() {
    const s = Math.max(0, data.timer.totalSeconds);
    const m = String(Math.floor(s / 60)).padStart(2, "0");
    const sec = String(s % 60).padStart(2, "0");
    timeText.textContent = `${m}:${sec}`;
  }

  function realElapsedSec() {
    let s = data.timer.elapsedSec || 0;
    if (data.timer.sessionStartAt) s += (Date.now() - data.timer.sessionStartAt) / 1000;
    return s;
  }

  // Sound notification
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function playChime() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [
      { f: 880, t: 0, d: 0.2 },
      { f: 1174.66, t: 0.24, d: 0.2 },
      { f: 1567.98, t: 0.48, d: 0.22 },
      { f: 1318.51, t: 0.74, d: 0.5 }
    ];
    notes.forEach(n => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = n.f;
      gain.gain.setValueAtTime(0.0001, now + n.t);
      gain.gain.exponentialRampToValueAtTime(0.6, now + n.t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + n.t);
      osc.stop(now + n.t + n.d + 0.05);
    });
  }

  function tick() {
    if (data.timer.endAt) {
      const remainMs = data.timer.endAt - Date.now();
      data.timer.totalSeconds = Math.max(0, Math.round(remainMs / 1000));
      updateDisplay();
      if (remainMs > 0) {
        save();
        return;
      }
    } else if (data.timer.totalSeconds > 0) {
      data.timer.totalSeconds--;
      updateDisplay();
      save();
      return;
    }
    // 时间到
    clearInterval(timerId);
    timerId = null;
    data.timer.running = false;
    data.timer.endAt = null;
    data.timer.totalSeconds = 0;
    if (data.timer.sessionStartAt) {
      data.timer.elapsedSec += (Date.now() - data.timer.sessionStartAt) / 1000;
      data.timer.sessionStartAt = null;
    }
    save();
    ensureAudio();
    playChime();
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    alert("🐟 时间到啦！可以继续，也可以先记录本轮～");
  }

  startBtn.addEventListener("click", () => {
    if (data.timer.running) return;
    ensureAudio();
    data.timer.running = true;
    data.timer.endAt = Date.now() + data.timer.totalSeconds * 1000;
    if (!data.timer.sessionStartAt) data.timer.sessionStartAt = Date.now();
    if (!data.timer.sessionStartClock) data.timer.sessionStartClock = Date.now();
    save();
    timerId = setInterval(tick, 1000);
  });

  document.addEventListener("pointerdown", ensureAudio);

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && data.timer.running) tick();
  });
  window.addEventListener("focus", () => {
    if (data.timer.running) tick();
  });

  pauseBtn.addEventListener("click", () => {
    clearInterval(timerId);
    timerId = null;
    if (data.timer.running && data.timer.endAt) {
      data.timer.totalSeconds = Math.max(0, Math.round((data.timer.endAt - Date.now()) / 1000));
    }
    if (data.timer.sessionStartAt) {
      data.timer.elapsedSec += (Date.now() - data.timer.sessionStartAt) / 1000;
      data.timer.sessionStartAt = null;
    }
    data.timer.running = false;
    data.timer.endAt = null;
    save();
  });

  addBtn.addEventListener("click", () => {
    data.timer.addedSeconds += 20 * 60;
    data.timer.totalSeconds += 20 * 60;
    if (data.timer.endAt) data.timer.endAt += 20 * 60 * 1000;
    updateDisplay();
    save();
  });

  resetBtn.addEventListener("click", () => {
    clearInterval(timerId);
    timerId = null;
    data.timer.running = false;
    data.timer.endAt = null;
    data.timer.elapsedSec = 0;
    data.timer.sessionStartAt = null;
    data.timer.sessionStartClock = null;
    const val = Math.max(1, parseInt(timeInput.value) || 25);
    data.timer.baseSeconds = val * 60;
    data.timer.addedSeconds = 0;
    data.timer.totalSeconds = val * 60;
    updateDisplay();
    save();
  });

  timeInput.addEventListener("change", () => {
    if (data.timer.running) return;
    data.timer.endAt = null;
    data.timer.elapsedSec = 0;
    data.timer.sessionStartAt = null;
    data.timer.sessionStartClock = null;
    const val = Math.max(1, parseInt(timeInput.value) || 25);
    data.timer.baseSeconds = val * 60;
    data.timer.addedSeconds = 0;
    data.timer.totalSeconds = val * 60;
    updateDisplay();
    save();
  });

  // Todo list
  const todoInput = document.getElementById("todoInput");
  const addTodoBtn = document.getElementById("addTodoBtn");
  const todoList = document.getElementById("todoList");
  const activeTaskBox = document.getElementById("activeTaskBox");

  function renderTodos() {
    todoList.innerHTML = "";
    data.todos.forEach((todo, idx) => {
      const card = document.createElement("div");
      card.className = "task-card";
      if (idx === data.activeTodoIndex) card.classList.add("active");
      if (todo.done) card.classList.add("done");

      card.innerHTML = `
        <div class="task-top">
          <div class="status-circle ${todo.done ? "done" : ""}" data-idx="${idx}"></div>
          <span class="type-tag ${todo.type === "small" ? "small" : ""}">${todo.type === "small" ? "小" : "大"}</span>
          <div class="task-name ${todo.type === "small" ? "small" : ""}">${escapeHtml(todo.name)}</div>
          <div class="task-minutes">${todo.totalMin} 分钟</div>
          <button class="task-delete" data-del="${idx}">×</button>
        </div>
        <div class="review-text" contenteditable="true" data-review="${idx}">${escapeHtml(todo.review || "")}</div>
      `;

      card.addEventListener("click", (e) => {
        if (e.target.classList.contains("status-circle")) {
          e.stopPropagation();
          todo.done = !todo.done;
          save();
          renderTodos();
          return;
        }
        if (e.target.classList.contains("task-delete")) {
          e.stopPropagation();
          data.todos.splice(idx, 1);
          if (data.activeTodoIndex === idx) data.activeTodoIndex = null;
          save();
          renderTodos();
          return;
        }
        if (e.target.classList.contains("review-text")) return;
        data.activeTodoIndex = idx;
        save();
        renderTodos();
      });

      const reviewEl = card.querySelector(".review-text");
      reviewEl.addEventListener("blur", () => {
        todo.review = reviewEl.innerText.trim();
        save();
      });
      reviewEl.addEventListener("click", (e) => e.stopPropagation());

      todoList.appendChild(card);
    });

    renderActiveTask();
  }

  function renderActiveTask() {
    if (data.activeTodoIndex === null || !data.todos[data.activeTodoIndex]) {
      activeTaskBox.innerHTML = `<div style="font-size:13px;color:var(--text-sub);text-align:center;padding:10px 0;">请先选择一个大任务</div>`;
      return;
    }
    const todo = data.todos[data.activeTodoIndex];
    activeTaskBox.innerHTML = `
      <div class="task-card active">
        <div class="task-top">
          <span class="type-tag ${todo.type === "small" ? "small" : ""}">${todo.type === "small" ? "小" : "大"}</span>
          <div class="task-name">${escapeHtml(todo.name)}</div>
          <div class="task-minutes">${todo.totalMin} 分钟</div>
        </div>
      </div>
    `;
  }

  let newTodoType = "big";
  document.querySelectorAll(".type-pick-btn").forEach(b => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".type-pick-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      newTodoType = b.dataset.tp;
    });
  });

  addTodoBtn.addEventListener("click", () => {
    const name = todoInput.value.trim();
    if (!name) return;
    data.todos.push({
      name,
      totalMin: 0,
      done: false,
      review: "",
      type: newTodoType
    });
    data.activeTodoIndex = data.todos.length - 1;
    todoInput.value = "";
    save();
    renderTodos();
  });

  // Subtask done
  const subTaskInput = document.getElementById("subTaskInput");
  const addSubDoneBtn = document.getElementById("addSubDone");
  const doneList = document.getElementById("doneList");

  function renderDone() {
    doneList.innerHTML = "";
    if (data.done.length === 0) {
      doneList.innerHTML = `<div class="empty-tip">还没有完成记录</div>`;
      return;
    }
    [...data.done].reverse().forEach((item, i) => {
      const idx = data.done.length - 1 - i;
      const type = item.type || "big";
      const div = document.createElement("div");
      div.className = "done-item";
      div.innerHTML = `
        <span>
          <span class="type-tag ${type === "small" ? "small" : ""}">${type === "small" ? "小" : "大"}</span>
          <span class="done-name ${type === "small" ? "small" : ""}">${escapeHtml(item.taskName)} · ${escapeHtml(item.subName)}</span>
        </span>
        <span class="done-right">
          <span class="rec-range">${formatRange(item.startTime, item.endTime)}</span>
          <span class="done-min">${item.min} 分钟</span>
          <button class="done-del" data-idx="${idx}" title="删除这条记录">✕</button>
        </span>
      `;
      doneList.appendChild(div);
    });
  }

  function deleteDoneRecord(idx) {
    const item = data.done[idx];
    const todo = data.todos.find(t => t.name === item.taskName);
    if (todo) todo.totalMin = Math.max(0, (todo.totalMin || 0) - item.min);
    data.done.splice(idx, 1);
    save();
    renderDone();
    renderCalendar();
  }

  doneList.addEventListener("click", e => {
    const btn = e.target.closest(".done-del");
    if (!btn) return;
    const idx = Number(btn.dataset.idx);
    if (idx < 0 || idx >= data.done.length) return;
    const item = data.done[idx];
    if (!confirm(`确定删除「${item.taskName} · ${item.subName}」这条记录吗？`)) return;
    deleteDoneRecord(idx);
  });

  addSubDoneBtn.addEventListener("click", () => {
    if (data.activeTodoIndex === null) {
      alert("🐟 请先选择一个大任务");
      return;
    }
    const subName = subTaskInput.value.trim();
    if (!subName) {
      alert("🐟 请填写本轮内容");
      return;
    }
    const usedMin = Math.max(1, Math.round(realElapsedSec() / 60));

    const todo = data.todos[data.activeTodoIndex];
    todo.totalMin += usedMin;

    const now = new Date();
    data.done.push({
      taskName: todo.name,
      subName,
      min: usedMin,
      date: formatDate(now),
      timestamp: now.getTime(),
      type: todo.type || "big",
      startTime: data.timer.sessionStartClock || null,
      endTime: now.getTime()
    });

    subTaskInput.value = "";
    data.timer.elapsedSec = 0;
    data.timer.sessionStartAt = null;
    data.timer.sessionStartClock = null;
    save();
    renderTodos();
    renderDone();
    renderShelved();
    alert(`🐟 已记录：${usedMin} 分钟`);
  });

  // Shelve（搁置待续任务）
  const shelveBtn = document.getElementById("shelveBtn");
  const shelveCard = document.getElementById("shelveCard");
  const shelvedList = document.getElementById("shelvedList");

  function renderShelved() {
    shelveCard.style.display = data.shelved.length ? "block" : "none";
    shelvedList.innerHTML = "";
    data.shelved.forEach((s, i) => {
      const div = document.createElement("div");
      div.className = "shelved-item";
      div.innerHTML = `
        <div class="shelved-main">
          <span class="type-tag ${s.type === "small" ? "small" : ""}">${s.type === "small" ? "小" : "大"}</span>
          <span class="shelved-name ${s.type === "small" ? "small" : ""}">${escapeHtml(s.taskName)}</span>
          <span class="shelved-sub">${escapeHtml(s.subName)}</span>
        </div>
        <div class="shelved-meta">已专注 ${Math.max(1, Math.round(s.elapsedSec / 60))} 分钟</div>
        <div class="shelved-actions">
          <button class="btn btn-ghost btn-small" data-sresume="${i}">▶ 继续</button>
          <button class="btn btn-ghost btn-small" data-sdrop="${i}">✕ 丢弃</button>
        </div>
      `;
      shelvedList.appendChild(div);
    });
  }

  shelvedList.addEventListener("click", e => {
    const resumeBtn = e.target.closest("[data-sresume]");
    const dropBtn = e.target.closest("[data-sdrop]");
    if (resumeBtn) {
      const i = Number(resumeBtn.dataset.sresume);
      const s = data.shelved[i];
      if (!s) return;
      if (!data.todos[s.activeTodoIndex]) {
        alert("🐟 这个任务已经被删掉了，先重新添加吧");
        data.shelved.splice(i, 1);
        save();
        renderShelved();
        return;
      }
      data.activeTodoIndex = s.activeTodoIndex;
      data.timer.elapsedSec = s.elapsedSec || 0;
      data.timer.sessionStartAt = null;
      data.timer.sessionStartClock = s.startClock || Date.now();
      subTaskInput.value = s.subName || "";
      data.shelved.splice(i, 1);
      save();
      renderTodos();
      renderShelved();
      alert(`🐟 已继续「${s.taskName}」，计时已合并，继续加油～`);
      return;
    }
    if (dropBtn) {
      const i = Number(dropBtn.dataset.sdrop);
      const s = data.shelved[i];
      if (!s) return;
      if (!confirm(`丢弃「${s.taskName} · ${s.subName}」这条待继续任务吗？已专注的 ${Math.max(1, Math.round(s.elapsedSec / 60))} 分钟不计入记录。`)) return;
      data.shelved.splice(i, 1);
      save();
      renderShelved();
    }
  });

  shelveBtn.addEventListener("click", () => {
    if (data.activeTodoIndex === null) {
      alert("🐟 请先选择一个任务");
      return;
    }
    const todo = data.todos[data.activeTodoIndex];
    data.shelved.push({
      taskName: todo.name,
      subName: subTaskInput.value.trim() || "（未填写内容）",
      elapsedSec: realElapsedSec(),
      type: todo.type || "big",
      startClock: data.timer.sessionStartClock || Date.now(),
      activeTodoIndex: data.activeTodoIndex
    });
    subTaskInput.value = "";
    clearInterval(timerId);
    timerId = null;
    data.timer.running = false;
    data.timer.endAt = null;
    data.timer.elapsedSec = 0;
    data.timer.sessionStartAt = null;
    data.timer.sessionStartClock = null;
    const val = Math.max(1, parseInt(timeInput.value) || 25);
    data.timer.baseSeconds = val * 60;
    data.timer.addedSeconds = 0;
    data.timer.totalSeconds = val * 60;
    updateDisplay();
    data.activeTodoIndex = null;
    save();
    renderTodos();
    renderShelved();
    alert(`🐟 已搁置「${todo.name}」，先去做别的吧～`);
  });

  // Notes
  const noteBox = document.getElementById("noteBox");
  noteBox.addEventListener("input", () => {
    data.notes = noteBox.value;
    save();
  });

  // Calendar
  const calMonth = document.getElementById("calMonth");
  const calGrid = document.getElementById("calGrid");
  const prevMonth = document.getElementById("prevMonth");
  const nextMonth = document.getElementById("nextMonth");
  let calDate = new Date();
  calDate.setDate(1);

  function renderCalendar() {
    const y = calDate.getFullYear();
    const m = calDate.getMonth();
    calMonth.textContent = `${y}年${m + 1}月`;
    calGrid.innerHTML = "";

    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement("div");
      calGrid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const day = document.createElement("div");
      day.className = "cal-day";
      const dateStr = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dayRecords = data.done.filter(x => x.date === dateStr);
      const dayMin = dayRecords.reduce((sum, x) => sum + x.min, 0);

      if (dayRecords.length > 0) day.classList.add("has-record");
      const today = new Date();
      if (today.getFullYear() === y && today.getMonth() === m && today.getDate() === d) {
        day.classList.add("today");
      }

      day.innerHTML = `
        <div class="cal-day-num">${d}</div>
        ${dayMin > 0 ? `<div class="cal-day-min">${dayMin}分钟</div>` : ""}
      `;
      day.addEventListener("click", () => showDay(dateStr, dayRecords));
      calGrid.appendChild(day);
    }
  }

  prevMonth.addEventListener("click", () => {
    calDate.setMonth(calDate.getMonth() - 1);
    renderCalendar();
  });
  nextMonth.addEventListener("click", () => {
    calDate.setMonth(calDate.getMonth() + 1);
    renderCalendar();
  });

  // Day modal
  const dayModal = document.getElementById("dayModal");
  const dayModalTitle = document.getElementById("dayModalTitle");
  const dayModalContent = document.getElementById("dayModalContent");
  document.getElementById("closeModal").addEventListener("click", () => {
    dayModal.classList.remove("show");
  });

  function showDay(dateStr, records) {
    dayModalTitle.textContent = dateStr;
    dayModalContent.innerHTML = "";

    if (records.length === 0) {
      dayModalContent.innerHTML = `<div class="empty-tip">当天没有记录</div>`;
    } else {
      const total = records.reduce((a, r) => a + r.min, 0);
      const head = document.createElement("div");
      head.className = "day-task-name";
      head.innerHTML = `
        <span>共 ${records.length} 条</span>
        <span style="color:var(--rose-500);font-size:14px;">合计 ${total} 分钟</span>
      `;
      dayModalContent.appendChild(head);

      records.forEach(r => {
        const idx = data.done.indexOf(r);
        const todo = data.todos.find(t => t.name === r.taskName);
        const type = r.type || "big";
        const status = todo ? (todo.done ? "✔" : "◯") : "·";
        const review = todo && todo.review ? todo.review : "暂无复盘";
        const item = document.createElement("div");
        item.className = "day-task-item";
        item.innerHTML = `
          <div class="day-task-name">
            <span>
              <span class="type-tag ${type === "small" ? "small" : ""}">${type === "small" ? "小" : "大"}</span>
              <span class="done-name ${type === "small" ? "small" : ""}">${escapeHtml(r.taskName)} ${status} · ${escapeHtml(r.subName)}</span>
            </span>
            <span class="done-right">
              <span class="rec-range">${formatRange(r.startTime, r.endTime)}</span>
              <span style="color:var(--rose-500);font-size:13px;">${r.min}分钟</span>
              <button class="done-del" data-idx="${idx}" title="删除这条记录">✕</button>
            </span>
          </div>
          <div class="day-task-review">${escapeHtml(review)}</div>
        `;
        dayModalContent.appendChild(item);
      });
    }
    dayModal.classList.add("show");
  }

  dayModalContent.addEventListener("click", e => {
    const btn = e.target.closest(".done-del");
    if (!btn) return;
    const idx = Number(btn.dataset.idx);
    if (idx < 0 || idx >= data.done.length) return;
    const item = data.done[idx];
    if (!confirm(`确定删除「${item.taskName} · ${item.subName}」这条记录吗？`)) return;
    deleteDoneRecord(idx);
    showDay(dayModalTitle.textContent, data.done.filter(x => x.date === dayModalTitle.textContent));
  });

  // Export & Print
  const exportBtn = document.getElementById("exportBtn");
  const exportArea = document.getElementById("exportArea");
  const printBtn = document.getElementById("printBtn");
  const printContainer = document.getElementById("printContainer");

  function buildMonthSummary() {
    const y = calDate.getFullYear();
    const m = calDate.getMonth() + 1;
    const monthRecords = data.done.filter(x => {
      const [yy, mm] = x.date.split("-").map(Number);
      return yy === y && mm === m;
    });

    let text = `🐟 番茄 · ${y}年${m}月 汇总\n\n`;
    if (monthRecords.length === 0) {
      text += "本月暂无记录";
    } else {
      const dayMap = {};
      monthRecords.forEach(r => {
        if (!dayMap[r.date]) dayMap[r.date] = {};
        if (!dayMap[r.date][r.taskName]) dayMap[r.date][r.taskName] = 0;
        dayMap[r.date][r.taskName] += r.min;
      });

      Object.keys(dayMap).sort().forEach(date => {
        text += `【${date}】\n`;
        const dayTotal = Object.values(dayMap[date]).reduce((a, b) => a + b, 0);
        text += `当日总耗时：${dayTotal}分钟\n`;
        Object.keys(dayMap[date]).forEach(taskName => {
          const todo = data.todos.find(t => t.name === taskName);
          const status = todo ? (todo.done ? "✔" : "◯") : "·";
          const review = todo && todo.review ? ` | ${todo.review}` : "";
          text += `  - ${taskName} ${status} ${dayMap[date][taskName]}分钟${review}\n`;
        });
        text += "\n";
      });
    }

    return text;
  }

  exportBtn.addEventListener("click", () => {
    exportArea.style.display = "block";
    exportArea.innerHTML = buildPrintHTML();
  });

  function buildPrintHTML() {
    const y = calDate.getFullYear();
    const m = calDate.getMonth() + 1;
    const cnM = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
    const weekNames = ["周日","周一","周二","周三","周四","周五","周六"];
    const monthRecords = data.done.filter(x => {
      const [yy, mm] = x.date.split("-").map(Number);
      return yy === y && mm === m;
    });

    if (monthRecords.length === 0) {
      return '<div class="p-empty">本月暂无记录</div>';
    }

    const dayGroups = {};
    monthRecords.forEach(r => {
      if (!dayGroups[r.date]) dayGroups[r.date] = [];
      dayGroups[r.date].push(r);
    });

    let totalMin = 0;
    let daysHTML = "";
    Object.keys(dayGroups).sort().forEach(date => {
      const [yy, mm, dd] = date.split("-").map(Number);
      const d = new Date(yy, mm - 1, dd);
      const dayRecords = dayGroups[date];
      const dayTotal = dayRecords.reduce((a, r) => a + r.min, 0);
      totalMin += dayTotal;
      let tasksHTML = "";
      dayRecords.forEach(r => {
        const todo = data.todos.find(t => t.name === r.taskName);
        const type = r.type || (todo && todo.type) || "big";
        const status = todo ? (todo.done ? "done" : "doing") : "none";
        const statusChar = todo ? (todo.done ? "✔" : "◯") : "·";
        const review = todo && todo.review ? escapeHtml(todo.review) : "";
        const range = formatRange(r.startTime, r.endTime);
        tasksHTML += '<div class="p-task p-task-' + type + '">'
          + '<span class="p-status p-status-' + status + '">' + statusChar + '</span>'
          + '<span class="p-type-tag' + (type === "small" ? " p-type-tag-small" : "") + '">' + (type === "small" ? "小" : "大") + '</span>'
          + '<span class="p-name">' + escapeHtml(r.taskName) + (r.subName ? ' · ' + escapeHtml(r.subName) : '') + '</span>'
          + '<span class="p-min">' + (range ? range + ' · ' : '') + r.min + '分钟</span>'
          + (review ? '<div class="p-review">复盘：' + review + '</div>' : '')
          + '</div>';
      });
      daysHTML += '<div class="p-day">'
        + '<div class="p-day-head">'
        + '<span class="p-day-num">' + dd + '号</span>'
        + '<span class="p-day-week">' + weekNames[d.getDay()] + '</span>'
        + '<span class="p-day-total">共 ' + dayTotal + ' 分钟</span>'
        + '</div>'
        + tasksHTML
        + '</div>';
    });

    const days = Object.keys(dayGroups).length;
    return '<div class="p-page">'
      + '<div class="p-title">🐟 ' + cnM[m - 1] + '专注汇总</div>'
      + '<div class="p-sub">' + y + '年 · 共 ' + monthRecords.length + ' 条 · ' + totalMin + ' 分钟 · ' + days + ' 天</div>'
      + daysHTML
      + '<div class="p-legend">'
      + '<span><span class="p-status p-status-done">✔</span> 已完成</span>'
      + '<span><span class="p-status p-status-doing">◯</span> 进行中</span>'
      + '<span><span class="p-status p-status-none">·</span> 未登记</span>'
      + '<span><span class="p-type-tag">大</span> 大任务</span>'
      + '<span><span class="p-type-tag p-type-tag-small">小</span> 小任务</span>'
      + '</div>'
      + '</div>';
  }

  printBtn.addEventListener("click", () => {
    printContainer.innerHTML = buildPrintHTML();
    window.print();
  });

  // Toast button
  document.getElementById("toastBtn").addEventListener("click", () => {
    alert("🐟 鱼鱼说：专注完记得休息一下～");
  });

  // Utils
  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));
  }

  function fmtHM(ms) {
    if (!ms) return "";
    const d = new Date(ms);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function formatRange(s, e) {
    const a = fmtHM(s);
    const b = fmtHM(e);
    return a && b ? a + "-" + b : "";
  }

  // Init
  timeInput.value = Math.round(data.timer.baseSeconds / 60) || 25;
  updateDisplay();
  if (data.timer.running) {
    if (!data.timer.endAt) data.timer.endAt = Date.now() + data.timer.totalSeconds * 1000;
    timerId = setInterval(tick, 1000);
    tick();
  }
  noteBox.value = data.notes || "";
  renderTodos();
  renderDone();
  renderCalendar();
  renderShelved();
})();
</script>
</body>
</html>
